# ==================================================================
# RAG Chatbot — docker-compose
# ==================================================================
# Production:   docker compose up -d --build
# Dev (reload): docker compose -f docker-compose.yml -f docker-compose.dev.yml up -d --build
# Shortcut:     make up  /  make up-dev  (see Makefile)
#
# Profiles:
#   --profile ollama   → run Ollama in container (default: use host Ollama)
#   --profile postgres → enable PostgreSQL persistence
# ==================================================================

name: rag-chatbot

networks:
  rag-net:
    driver: bridge

volumes:
  qdrant_data:
  redis_data:
  ollama_data:
  postgres_data:
  prometheus_data:
  grafana_data:

services:

  # --------------------------------------------------------------
  # Qdrant — vector database
  # --------------------------------------------------------------
  qdrant:
    image: qdrant/qdrant:v1.11.3
    container_name: rag-qdrant
    restart: unless-stopped
    networks: [rag-net]
    ports:
      - "6333:6333"
    volumes:
      - qdrant_data:/qdrant/storage
    healthcheck:
      test: ["CMD-SHELL", "bash -c ':> /dev/tcp/127.0.0.1/6333' || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # --------------------------------------------------------------
  # Redis — conversation cache
  # --------------------------------------------------------------
  redis:
    image: redis:7.2-alpine
    container_name: rag-redis
    restart: unless-stopped
    networks: [rag-net]
    ports:
      - "6379:6379"
    command: ["redis-server", "--appendonly", "yes", "--maxmemory", "256mb", "--maxmemory-policy", "allkeys-lru"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # --------------------------------------------------------------
  # PostgreSQL — conversation persistence (opt-in via --profile postgres)
  # Activate: docker compose --profile postgres up -d
  # Set DATABASE_URL=postgresql+asyncpg://chatbot:chatbot@postgres:5432/chatbot in .env
  # --------------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    container_name: rag-postgres
    restart: unless-stopped
    profiles: ["postgres"]
    networks: [rag-net]
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: chatbot
      POSTGRES_PASSWORD: chatbot
      POSTGRES_DB: chatbot
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U chatbot -d chatbot"]
      interval: 10s
      timeout: 5s
      retries: 5
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # --------------------------------------------------------------
  # Ollama — LLM runtime (opt-in via --profile ollama)
  # Default setup uses Ollama on host via host.docker.internal.
  # --------------------------------------------------------------
  ollama:
    image: ollama/ollama:0.3.14
    container_name: rag-ollama
    restart: unless-stopped
    profiles: ["ollama"]
    networks: [rag-net]
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 20s
      timeout: 10s
      retries: 3
      start_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # --------------------------------------------------------------
  # Redis Exporter — exposes Redis metrics for Prometheus
  # --------------------------------------------------------------
  redis-exporter:
    image: oliver006/redis_exporter:v1.62.0-alpine
    container_name: rag-redis-exporter
    restart: unless-stopped
    networks: [rag-net]
    environment:
      REDIS_ADDR: redis://redis:6379
    depends_on:
      redis:
        condition: service_healthy
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "2"

  # --------------------------------------------------------------
  # Prometheus — metrics collection
  # --------------------------------------------------------------
  prometheus:
    image: prom/prometheus:v2.52.0
    container_name: rag-prometheus
    restart: unless-stopped
    networks: [rag-net]
    ports:
      - "9090:9090"
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=15d"
      - "--web.console.libraries=/usr/share/prometheus/console_libraries"
      - "--web.console.templates=/usr/share/prometheus/consoles"
    volumes:
      - ./docker/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:9090/-/ready"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # --------------------------------------------------------------
  # Grafana — metrics visualization
  # --------------------------------------------------------------
  grafana:
    image: grafana/grafana:10.4.3
    container_name: rag-grafana
    restart: unless-stopped
    networks: [rag-net]
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GF_SECURITY_ADMIN_PASSWORD:?GF_SECURITY_ADMIN_PASSWORD must be set in .env}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/rag_chatbot.json
    volumes:
      - grafana_data:/var/lib/grafana
      - ./docker/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./docker/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      prometheus:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:3000/api/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # --------------------------------------------------------------
  # Backend — FastAPI RAG service
  # --------------------------------------------------------------
  backend:
    build:
      context: .
      dockerfile: docker/Dockerfile
    image: rag-chatbot:latest
    container_name: rag-backend
    restart: unless-stopped
    networks: [rag-net]
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      # Container-network hostname overrides — always use service names inside Docker.
      QDRANT_HOST: qdrant
      REDIS_HOST: redis
      USE_CACHE: "true"
      LOG_FORMAT: json
      APP_ENVIRONMENT: production
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL}
      # Override .env local paths — models are baked into /opt/models in the image.
      HF_HOME: /opt/models
      SENTENCE_TRANSFORMERS_HOME: /opt/models
      TRANSFORMERS_CACHE: /opt/models
      HF_HUB_OFFLINE: "1"
      TRANSFORMERS_OFFLINE: "1"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ../data:/app/data
    depends_on:
      qdrant:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 45s
    deploy:
      resources:
        limits:
          memory: 4G
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
