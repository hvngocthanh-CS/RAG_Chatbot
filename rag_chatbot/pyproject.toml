[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "rag-chatbot"
version = "2.0.0"
description = "Production-ready RAG Chatbot for Enterprise Document Q&A"
requires-python = ">=3.10"
readme = "README.md"

dependencies = [
    "fastapi>=0.109.0",
    "uvicorn[standard]>=0.27.0",
    "python-multipart>=0.0.6",
    "pydantic>=2.5.0",
    "pydantic-settings>=2.1.0",
    "openai>=1.10.0",
    "sentence-transformers>=2.7.0",
    "torch>=2.0.0",
    "qdrant-client>=1.7.0",
    "pdfplumber>=0.10.0",
    "python-docx>=1.1.0",
    "tiktoken>=0.5.0",
    "rank_bm25>=0.2.2",
    "numpy>=1.24.0",
]

[project.optional-dependencies]
eval = [
    "ragas>=0.2.0",
    "datasets>=2.14.0",
]
cache = [
    "redis>=5.0.0",
]
postgres = [
    "sqlalchemy[asyncio]>=2.0.0",
    "asyncpg>=0.29.0",
]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.23.0",
    "httpx>=0.25.0",
    "pytest-mock>=3.12.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
asyncio_mode = "auto"
addopts = "-v --tb=short"

[tool.setuptools.packages.find]
include = ["backend*"]
