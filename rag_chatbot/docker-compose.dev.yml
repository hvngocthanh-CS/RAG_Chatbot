# ==================================================================
# Dev overrides — hot-reload, verbose logging, no memory cap
# ==================================================================
# Usage:
#   docker compose -f docker-compose.yml -f docker-compose.dev.yml up -d --build
# ==================================================================

services:
  backend:
    command:
      - uvicorn
      - backend.api.main:app
      - --host
      - "0.0.0.0"
      - --port
      - "8000"
      - --reload
      - --log-level
      - debug
    volumes:
      - ./backend:/app/backend    # hot-reload on every save
    environment:
      APP_ENVIRONMENT: development
      LOG_FORMAT: console
      DEBUG: "true"
    deploy:
      resources: {}               # no memory cap in dev
